name: Run CodeCov
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      system_deps: 'swig sox mpg123'
      test_path: 'test/unittests'
      coverage_source: 'ovos_audio'
      deploy_pages: false
      pr_comment: true
