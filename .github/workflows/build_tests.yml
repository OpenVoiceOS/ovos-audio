name: Run Build Tests
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      test_path: 'test/unittests'
      system_deps: 'swig sox mpg123'
